<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{{ .Site.Title }} | {{ .Title }}</title>
        <link rel="stylesheet" href="{{ "/css/style.css" | relURL }}">
        <link rel="icon" type="image/x-icon" href="/favicon.ico?v=20260521b">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260521b">
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20260521b">
    </head>
    <body>
        <div class="wrapper">
            <header>
                <div class="site-identity">
                <h1 style="font-size:250%;">{{ .Site.Title }}</h1>

                <!-- begin short bio -->
                <p>{{ .Site.Params.shortbioline1 }}<br>
                {{ .Site.Params.shortbioline2 }}</p>
                <!-- end short bio -->
                </div>


                <hr/>

                {{ partial "sidebar.html" . }}

                <hr/>

                <!-- begin photo -->
                {{ with .Site.Params.logo }}
                <img class="profile-photo" src="{{ . | relURL }}" alt="{{ $.Site.Title }}" />
                {{ end }}
                <!-- end photo -->
                <br><br>

            </header>
