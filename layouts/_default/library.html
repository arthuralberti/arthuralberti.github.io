{{ define "main" -}}
<div class="library-page">
  <div class="library-heading">
    <h2>Library</h2>
    <p>Books I have read and books I would like to explore.</p>
  </div>
  <div class="rotating-library" data-rotating-library></div>
  <div class="library-collection">
    <button class="catalog-back" type="button" aria-label="Return to bookshelf">↶</button>
{{ $shelfVersion := substr (crypto.SHA256 (readFile "static/library/books.html")) 0 12 }}
    <iframe class="library-shelf" src="{{ printf "library/books.html?v=%s" $shelfVersion | relURL }}" title="The Library — interactive bookshelf"></iframe>
  </div>
</div>
{{ partial "collection-objects-assets.html" . }}
<noscript><style>.catalog-back { display: none; }</style></noscript>
<style>
  .library-heading {
    border-bottom: 1px solid #e5e5e5;
    margin-bottom: 18px;
    padding-bottom: 16px;
  }
  .library-heading h2 { margin-bottom: 10px; }
  .library-heading > p {
    color: #555;
    font-size: 16px;
    line-height: 1.55;
    margin: 0 0 12px;
  }
  .library-shelf { border: 0; display: block; height: 800px; width: 100%; }
  @media (max-width: 720px) {
    .library-shelf { height: 75vh; min-height: 500px; }
  }
</style>
{{- end }}
