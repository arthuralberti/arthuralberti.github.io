{{- $book := .book -}}
<a class="book-button{{ if .stack }} stacked-book{{ end }}" href="#book-{{ $book.id }}" role="button" aria-label="{{ $book.title }}" aria-controls="book-reading-room" aria-expanded="false" data-book-id="{{ $book.id }}" style="--cloth:{{ $book.cloth }};--foil:{{ $book.foil }};--h:{{ add 147 (mod $book.id 6) }}px;--depth:{{ add 20 (mod (mul $book.id 7) 13) }}px;--d:var(--depth);--lean:{{ mul (sub (mod $book.id 5) 2) 0.25 }}deg;--grain-offset:{{ mul $book.id 17 }}px">
  <span class="resting-spine" aria-hidden="true"><span class="spine-title">{{ $book.title }}</span></span>
  <span class="book-volume" aria-hidden="true">
    <span class="book-pages"></span>
    <span class="book-page-top"></span>
    <span class="book-page-bottom"></span>
    <span class="book-cover-back"></span>
    <span class="book-title-page"><span>{{ $book.title }}</span></span>
    <span class="book-cover-front"><span class="cover-outside"><span class="cover-title">{{ $book.title }}</span><span class="cover-rule"></span></span><span class="cover-inside"></span></span>
    <span class="book-spine"><span class="spine-title">{{ $book.title }}</span></span>
  </span>
</a>
