works:
- title: "Personal Finances Dashboard"
  description: "Dashboard for organizing personal finances, tracking spending patterns, and turning transaction-level data into a clearer view of monthly budgets and financial behavior."

- title: "Faculty Explorer"
  description: "An interactive database of economics faculty at my target universities — searchable and filterable by field and institution, with each professor's research areas, current affiliation, personal website, and links to their recent papers."
  link: "https://faculty-explorer.pages.dev/"

- title: "Restaurants"
  description: "I love trying new restaurants and keeping track of places I want to visit, revisit, or recommend. I organize this through Google Maps lists, now available through an interactive map."
  link: "https://arthuralberti.github.io/restaurant-mapping/"

- title: "Favorite Papers"
  description: "A curated list of papers I especially like, with brief notes on why I find them useful, elegant, or worth revisiting."

- title: "Card & Board Games"
  description: "I am an avid card-game player. I play Bridge at the <em>Associação Paulistana de Bridge</em> and King occasionally at a local club, and I am currently creating my own optimal version of <em>Canastra</em> / <em>Buraco</em> / <em>Tranca</em> — designing the rules that maximize a balanced game. I am also passionate about board games: twice a month, a regular group of friends and I get together to play games such as Catan, Power Grid, and <em>Canastra</em>."

- title: "Central Banks"
  description: "I collect photos with central banks. Having worked in finance, I developed a lasting interest in monetary policy and in the role central bankers play in managing expectations. So far, the collection includes <em>Banco Central de Chile</em>; the Federal Reserve Board in Washington, D.C.; the Federal Reserve Bank of New York; the Federal Reserve Bank of Chicago; the Bank of England; the Bank of Scotland; and the <em>Banco Central do Brasil</em>. My current profile photo was taken in front of the Bank of Scotland."

- title: "Substack"
  link: "https://arthuralberti.substack.com/"

- title: "Goodreads"
  link: "https://www.goodreads.com/user/show/128148581-arthur-alberti"
