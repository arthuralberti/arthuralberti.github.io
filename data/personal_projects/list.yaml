- title: "Favorite Papers"
  description: "A curated list of papers I like for different reasons: some are among the best papers ever written, some became deeply influential, and others have a special place in how they helped me see economics more clearly."
  link: "favorite-papers/"

- title: "Card & Board Games"
  description: "I am an avid card-game player. I play Bridge at the <em>Associação Paulistana de Bridge</em> and King occasionally at a local club, and I am currently creating my own optimal version of <em>Canastra</em> / <em>Buraco</em> / <em>Tranca</em> — designing the rules that maximize a balanced game. I am also passionate about board games: twice a month, a regular group of friends and I get together to play games such as Catan, Power Grid, and <em>Canastra</em>."

- title: "Central Banks"
  description: "I collect photos with central banks. Having worked in finance, I developed a lasting interest in monetary policy and in the role central bankers play in managing expectations. So far, the collection includes <em>Banco Central de Chile</em>; the Federal Reserve Board in Washington, D.C.; the Federal Reserve Bank of New York; the Federal Reserve Bank of Chicago; the Bank of England; and the <em>Banco Central do Brasil</em>."

