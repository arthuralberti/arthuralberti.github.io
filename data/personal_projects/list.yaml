works:
- title: "Personal Finances Dashboard"
  description: "Dashboard for organizing personal finances, tracking spending patterns, and turning transaction-level data into a clearer view of monthly budgets and financial behavior."

- title: "Faculty Explorer"
  description: "An interactive database of economics faculty at my target universities — searchable and filterable by field and institution, with each professor's research areas, current affiliation, personal website, and links to their recent papers."
  link: "https://arthuralberti.github.io/application-information.github.io/"

- title: "Card & Board Games"
  description: "I am an avid card-game player. I play Bridge at the <em>Associação Paulistana de Bridge</em> and King occasionally at a local club, and I am currently creating my own optimal version of <em>Canastra</em> / <em>Buraco</em> / <em>Tranca</em> — designing the rules that maximize a balanced game. I am also passionate about board games: twice a month, a regular group of friends and I get together to play games such as Catan, Power Grid, and <em>Canastra</em>."

- title: "Substack"
  link: "https://arthuralberti.substack.com/"

- title: "Goodreads"
