updated: "2026-05-24"
papers:
  - slug: fujiwara-voting-technology
    title: "Voting Technology, Political Responsiveness, and Infant Health: Evidence from Brazil"
    authors: "Thomas Fujiwara"
    year: "2015"
    venue: "Econometrica"
    doi: "10.3982/ECTA11520"
    paper_url: "https://www.econometricsociety.org/doi/10.3982/ECTA11520"
    note: "This paper studies the introduction of electronic voting in Brazil and shows that the technology reduced residual votes among less educated citizens, effectively expanding political participation. The resulting enfranchisement shifted policy toward public health spending and improved infant health outcomes, linking voting technology to political responsiveness and development."
  - slug: finan-schechter-vote-buying
    title: "Vote-Buying and Reciprocity"
    authors: "Frederico Finan and Laura A. Schechter"
    year: "2012"
    venue: "Econometrica"
    doi: "10.3982/ECTA9035"
    paper_url: "https://www.econometricsociety.org/doi/10.3982/ECTA9035"
    note: "This paper examines vote buying in Paraguay and argues that its effectiveness depends on reciprocity rather than only monitoring or coercion. Voters with stronger reciprocal preferences are more likely to be targeted by brokers and more likely to vote for the party that offered benefits, suggesting that vote buying can operate through internalized social obligations."
  - slug: shi-money-and-prices
    title: "Money and Prices: A Model of Search and Bargaining"
    authors: "Shouyong Shi"
    year: "1995"
    venue: "Journal of Economic Theory"
    doi: "10.1006/jeth.1995.1081"
    paper_url: "https://doi.org/10.1006/jeth.1995.1081"
    note: "This paper introduces divisible commodities and bargaining into a search-theoretic model of money in order to determine the purchasing power of fiat money endogenously. It shows that multiple monetary equilibria can coexist, with different implications for prices, output, welfare, velocity, currency substitution, and exchange-market intervention."
  - slug: taylor-discretion-policy-rules
    title: "Discretion versus Policy Rules in Practice"
    authors: "John B. Taylor"
    year: "1993"
    venue: "Carnegie-Rochester Conference Series on Public Policy"
    doi: "10.1016/0167-2231(93)90009-L"
    paper_url: "https://doi.org/10.1016/0167-2231(93)90009-L"
    note: "This paper compares discretionary monetary policy with policy rules and proposes a simple interest-rate rule that describes how the federal funds rate can respond to inflation and real activity. It evaluates the practical performance of such rules across historical episodes and argues that systematic policy can improve macroeconomic outcomes."
  - slug: engerman-sokoloff-factor-endowments
    title: "Institutions, Factor Endowments, and Paths of Development in the New World"
    authors: "Kenneth L. Sokoloff and Stanley L. Engerman"
    year: "2000"
    venue: "Journal of Economic Perspectives"
    doi: "10.1257/jep.14.3.217"
    paper_url: "https://www.aeaweb.org/articles?id=10.1257/jep.14.3.217"
    note: "This paper argues that a hemispheric perspective across European colonies in the New World shows how initial factor endowments shaped institutions and long-run paths of economic development."
  - slug: becker-rubin-woessmann-religion-growth
    title: "Religion and Growth"
    authors: "Sascha O. Becker, Jared Rubin, and Ludger Woessmann"
    year: "2024"
    venue: "Journal of Economic Literature"
    doi: "10.1257/jel.20231666"
    paper_url: "https://www.aeaweb.org/articles?id=10.1257/jel.20231666"
    note: "This paper surveys how religion can affect economic growth through physical capital, human capital, labor supply, technology, institutions, political economy, and conflict. It organizes a broad literature using the logic of macroeconomic production and argues that religion can either support or constrain growth depending on the mechanisms at work."
  - slug: akerlof-yellen-fairness-unemployment
    title: "Fairness and Unemployment"
    authors: "George A. Akerlof and Janet L. Yellen"
    year: "1988"
    venue: "American Economic Review"
    doi: ""
    paper_url: "https://www.jstor.org/stable/1818095"
    note: "This paper develops the idea that fairness considerations can affect wage setting and unemployment. If workers compare actual wages with perceived fair wages and adjust effort accordingly, firms may choose wage policies that depart from market-clearing levels, producing involuntary unemployment and wage rigidity."
  - slug: aghion-falling-growth-rising-rents
    title: "A Theory of Falling Growth and Rising Rents"
    authors: "Philippe Aghion, Antonin Bergeaud, Timo Boppart, Peter J. Klenow, and Huiyu Li"
    year: "2023"
    venue: "Review of Economic Studies"
    doi: "10.1093/restud/rdad016"
    paper_url: "https://doi.org/10.1093/restud/rdad016"
    note: "This paper proposes a theory linking slower growth, rising concentration, higher aggregate markups, and increased rents. Falling costs of operating across markets allow highly efficient firms to expand, temporarily raising productivity but making entry and innovation less attractive for other firms, which can reduce long-run growth."
  - slug: akerlof-kranton-economics-identity
    title: "Economics and Identity"
    authors: "George A. Akerlof and Rachel E. Kranton"
    year: "2000"
    venue: "Quarterly Journal of Economics"
    doi: "10.1162/003355300554881"
    paper_url: "https://doi.org/10.1162/003355300554881"
    note: "This paper incorporates identity into economic utility by allowing behavior to depend on social categories and the prescriptions attached to them. The framework shows how identity can change incentives and outcomes in settings such as gender, work, education, and social interaction, expanding standard models of preferences."
  - slug: card-krueger-minimum-wages
    title: "Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania"
    authors: "David Card and Alan B. Krueger"
    year: "1994"
    venue: "American Economic Review"
    doi: ""
    paper_url: "https://www.jstor.org/stable/2118030"
    note: "This paper studies New Jersey's 1992 minimum wage increase by comparing fast-food restaurants in New Jersey with restaurants in neighboring Pennsylvania before and after the policy change. The evidence does not show the employment decline predicted by the competitive model and became a central reference point for empirical minimum-wage research."
  - slug: baqaee-farhi-productivity-misallocation
    title: "Productivity and Misallocation in General Equilibrium"
    authors: "David Rezza Baqaee and Emmanuel Farhi"
    year: "2020"
    venue: "Quarterly Journal of Economics"
    doi: "10.1093/qje/qjz030"
    paper_url: "https://doi.org/10.1093/qje/qjz030"
    note: "This paper develops a general-equilibrium framework for measuring how microeconomic distortions affect aggregate productivity when firms and sectors are connected through input-output linkages. It shows that misallocation depends on network structure, complementarities, and nonlinear interactions, so aggregate productivity losses cannot be inferred from micro wedges in isolation."
  - slug: barro-becker-fertility-growth
    title: "Fertility Choice in a Model of Economic Growth"
    authors: "Robert J. Barro and Gary S. Becker"
    year: "1989"
    venue: "Econometrica"
    doi: "10.2307/1912563"
    paper_url: "https://doi.org/10.2307/1912563"
    note: "This paper builds a growth model in which fertility is chosen endogenously by altruistic families. The model links child quantity, intergenerational transfers, human welfare, and capital accumulation, showing how demographic choices can interact with long-run economic growth."
  - slug: bates-greif-singh-organizing-violence
    title: "Organizing Violence"
    authors: "Robert H. Bates, Avner Greif, and Smita Singh"
    year: "2002"
    venue: "Journal of Conflict Resolution"
    doi: "10.1177/002200202236166"
    paper_url: "https://doi.org/10.1177/002200202236166"
    note: "This paper analyzes violence as an organized activity and studies how specialists in coercion can either protect production or prey upon it. The framework connects political order, economic development, and the institutional arrangements that channel the incentives of those capable of using force."
  - slug: duflo-economist-as-plumber
    title: "The Economist as Plumber"
    authors: "Esther Duflo"
    year: "2017"
    venue: "American Economic Review"
    doi: "10.1257/aer.p20171153"
    paper_url: "https://www.aeaweb.org/articles?id=10.1257/aer.p20171153"
    note: "This paper argues that economists should treat implementation as a central part of policy design rather than as an afterthought. By comparing economists to plumbers, it emphasizes diagnosis, iteration, institutional detail, and feedback in the design of policies that work in practice."
  - slug: roth-economist-as-engineer
    title: "The Economist as Engineer: Game Theory, Experimentation, and Computation as Tools for Design Economics"
    authors: "Alvin E. Roth"
    year: "2002"
    venue: "Econometrica"
    doi: "10.1111/1468-0262.00335"
    paper_url: "https://doi.org/10.1111/1468-0262.00335"
    note: "This paper presents market design as a form of engineering in which game theory, experiments, computation, and institutional detail are used to build real allocation mechanisms. Drawing on matching markets, it explains how economists can move from analysis to practical design."
  - slug: ogilvie-whatever-is-right
    title: "'Whatever Is, Is Right'? Economic Institutions in Pre-industrial Europe"
    authors: "Sheilagh Ogilvie"
    year: "2007"
    venue: "Economic History Review"
    doi: "10.1111/j.1468-0289.2007.00408.x"
    paper_url: "https://doi.org/10.1111/j.1468-0289.2007.00408.x"
    note: "This paper critiques the view that pre-industrial European institutions should be interpreted mainly as efficient responses to economic problems. It argues that many institutions persisted because they distributed rents, reinforced power, and excluded outsiders, so institutional analysis must account for distributional conflict as well as efficiency."
  - slug: rocha-ferraz-soares-human-capital
    title: "Human Capital Persistence and Development"
    authors: "Rudi Rocha, Claudio Ferraz, and Rodrigo R. Soares"
    year: "2017"
    venue: "American Economic Journal: Applied Economics"
    doi: "10.1257/app.20150532"
    paper_url: "https://www.aeaweb.org/articles?id=10.1257/app.20150532"
    note: "This paper examines long-run human-capital persistence using a Brazilian settlement policy that attracted more educated immigrants to selected regions in the late nineteenth and early twentieth centuries. A century later, treated municipalities had higher schooling and income, with persistence operating through educational inputs and occupational upgrading."
  - slug: greif-maghribi-traders
    title: "Reputation and Coalitions in Medieval Trade: Evidence on the Maghribi Traders"
    authors: "Avner Greif"
    year: "1989"
    venue: "Journal of Economic History"
    doi: "10.1017/S0022050700009475"
    paper_url: "https://doi.org/10.1017/S0022050700009475"
    note: "This paper uses evidence on Maghribi traders to study how reputation and coalition-based enforcement supported long-distance trade in the medieval Mediterranean. It shows how repeated relationships, information sharing, and collective punishment could sustain agency relations when formal legal enforcement was limited."
