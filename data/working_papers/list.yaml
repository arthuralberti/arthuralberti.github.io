works:
- title: "Who Benefits from Benefits? Municipal Consequences of Federal Cash Transfers"
  book: "Master's Thesis, University of São Paulo"
  pdflink: "/pdf/who-benefits-from-benefits.pdf?v=20260521"
  note: "Current version: May 21, 2026"
  presented: "University of São Paulo"
  abstract: >
      Cash transfer programs are centrally designed to limit local discretion. Yet in Brazil's Bolsa Família, eligibility rules and benefit values are managed federally while beneficiary registration is operated municipally through local welfare offices (CRAS). A 2009 federal reform revised the cross-municipal allocation formula, generating exogenous variation in authorized enrollment that we use to instrument realized expansion across the 2,105 municipalities, approximately 38 percent of the country, where the sitting mayor sought reelection in 2012. A one-standard-deviation increase in instrumented enrollment raises incumbent vote share by 2.94 percentage points, large enough to neutralize the typical inter-election incumbency disadvantage. The mechanism is gated at two binding margins: federal authorization translates weakly into realized expansion without a pre-existing CRAS, and approximately 93 percent of the within-CRAS identifying mass concentrates where the incoming mayor replaced the front-line manager between 2008 and 2009. Three quarters of those replacements bring in individuals new to the municipal welfare bureaucracy rather than internal reshuffles. The substitutes are not pre-selected on prior partisan affiliation but run for elected office at higher rates than stayers and align with the mayor's coalition, consistent with program expansion raising the visibility of the managerial post and with those individuals leveraging it to launch local electoral careers. Centralized design does not shield delivery from local politics.

- title: "Media as Political Currency"
  coauthors: "Alexsandros Cavgias (Ghent) and Luís Meloni (USP)"
  pdflink: "/pdf/media-as-political-currency.pdf"
  presented: "LACEA Annual Meeting (2025); Brazilian Econometric Society (2025)"
  abstract: >
      This paper studies how executives deploy control over broadcast media to influence legislative coalitions. We develop a simple framework in which radio and television concessions operate as political currency: by raising a legislator's electoral valence, media ownership lowers the ideological cost of supporting the executive, making ideologically proximate legislators particularly attractive targets. We test these predictions using a newly assembled dataset that links all radio and TV licenses granted in Brazil during the 1987-1988 National Constituent Assembly to detailed electoral, biographical, and roll-call information for every candidate in the 1986 election. Exploiting narrow-margin victories within party-state coalitions in a regression discontinuity design, we show that winning a seat in the Assembly sharply increases the probability of receiving a concession, with effects concentrated among government-aligned legislators. Concession recipients subsequently vote more consistently with the executive on pivotal constitutional issues and later experience persistent electoral advantages, detectable more than a decade after democratization. Together, the results provide evidence that media concessions were strategically allocated to reshape legislative coalitions at a foundational moment of institutional redesign, with lasting implications for political competition in Brazil.
