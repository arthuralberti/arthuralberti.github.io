works:
- title: "Who Benefits from Benefits? Municipal Consequences of Federal Cash Transfers"
  book: "Master's Thesis, University of São Paulo"
  pdflink: "/pdf/who-benefits-from-benefits.pdf?v=20260618"
  note: "Current version: June 18, 2026"
  presented: "LACEA Annual Meeting (2026); University of São Paulo (2026)"
  abstract: >
      Centralized welfare programs are designed to limit local discretion, yet their implementation often depends on municipal bureaucracies. We study whether local politicians can obtain electoral returns from a federally designed cash transfer when the remaining discretion lies in registration. In Brazil's Bolsa Família, eligibility rules, benefit values, and payments are set nationally, while municipal welfare offices register eligible households. We exploit a 2009 reform that changed the formula assigning municipal beneficiary quotas, generating differential authorized expansion across municipalities for reasons unrelated to local politics. In the 2,105 municipalities where the 2008 incumbent mayor sought reelection in 2012, the reform increased realized enrollment and improved incumbent performance. A one-standard-deviation quota shock raised incumbent vote share by about one percentage point in reduced form; instrumenting enrollment with the quota shock, an additional 1,000 beneficiary families raised vote share by approximately one percentage point. The return is conditional on local implementation capacity. The identifying first stage and electoral response are concentrated in municipalities with a pre-existing CRAS welfare office and, within those municipalities, where the incoming mayor replaced the inherited front-line manager. The shock did not cause manager turnover or new CRAS openings. Nor do substitute managers appear to be partisan loyalists: they are not selected through prior affiliation with the mayor's party or coalition, and they do not subsequently realign with it. Instead, they later run for local office at roughly twice the rate of stayers, consistent with the managerial post becoming a platform for local political careers. Centralized rules and payment flows therefore do not depoliticize transfers whose last mile remains locally administered; program design travels only as far as local capacity carries it.

- title: "Media as Political Currency"
  coauthor_links:
    - name: "Alexsandros Cavgias"
      url: "https://sites.google.com/view/alexsandroscavgias/home?authuser=0"
    - name: "Luís Meloni"
      url: "https://luismeloni.com/"
  pdflink: "/pdf/media-as-political-currency.pdf"
  presented: "LACEA Annual Meeting (2025); Brazilian Econometric Society (2025)"
  note: "Current version: April 6, 2026"
  abstract: >
      This paper studies how executives deploy control over broadcast media to influence legislative coalitions. We develop a simple framework in which radio and television concessions operate as political currency: by raising a legislator's electoral valence, media ownership lowers the ideological cost of supporting the executive, making ideologically proximate legislators particularly attractive targets. We test these predictions using a newly assembled dataset that links all radio and TV licenses granted in Brazil during the 1987-1988 National Constituent Assembly to detailed electoral, biographical, and roll-call information for every candidate in the 1986 election. Exploiting narrow-margin victories within party-state coalitions in a regression discontinuity design, we show that winning a seat in the Assembly sharply increases the probability of receiving a concession, with effects concentrated among government-aligned legislators. Concession recipients subsequently vote more consistently with the executive on pivotal constitutional issues and later experience persistent electoral advantages, detectable more than a decade after democratization. Together, the results provide evidence that media concessions were strategically allocated to reshape legislative coalitions at a foundational moment of institutional redesign, with lasting implications for political competition in Brazil.

